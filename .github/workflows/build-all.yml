name: Build NixOS Images

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            system: x86_64-linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            system: aarch64-linux

    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      id-token: write

    # Определяем переменные окружения для бинарников (копии из .env)
    env:
      MUTTER_PATH_ARM: /nix/store/00ss6y3np52nlh37pzc824gq99cp9zkr-mutter-49.2
      GNOME_SHELL_PATH_ARM: /nix/store/b2phzf0a186ry7frvsgf04kxz4cyhy0k-gnome-shell-49.2
      JASONBOURNE_PATH_ARM: /nix/store/anck8nvlirrfpbnhzvpjb97x9lflp0zi-jasonbourne-v3.0.1
      # Добавляем x86 пути на случай если раскомментируют x86 в матрице
      MUTTER_PATH: /nix/store/fks66fq32rglhmbwfg3pj935saqwzvld-mutter-49.2
      GNOME_SHELL_PATH: /nix/store/rsyl3sipf4yk8whja4plafx5z6l05rqv-gnome-shell-49.2
      JASONBOURNE_PATH: /nix/store/05ckh7zfabh20lxp4k1kxgb6nyaqqy4y-jasonbourne-v3.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Client
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            use-xdg-base-directories = true
            system-features = nixos-test benchmark big-parallel kvm

      - name: Add github.com to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # Предварительное скачивание кеша (аналог pull-cache в justfile)
      # Для ARM используем переменные _ARM
      - name: Pull Binary Cache
        if: matrix.arch == 'arm64'
        run: |
          nix-store --realise \
            --option substituters 'http://devready.work:8080/system https://cache.nixos.org' \
            --option trusted-public-keys 'system:R0BqH3u7f2NsG4ySt87TfzMecyeh1daZWDjk/8h1z8g= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=' \
            $MUTTER_PATH_ARM \
            $GNOME_SHELL_PATH_ARM \
            $JASONBOURNE_PATH_ARM \
            $MUTTER_PATH \
            $GNOME_SHELL_PATH \
            $JASONBOURNE_PATH

      - name: Build and Compress QCOW2 Image (with-package)
        run: |
          # 1. Собираем with-package (Light + Proprietary).
          nix build .#packages.${{ matrix.system }}.with-package -L --impure

          # 2. Создаем папку для артефактов
          mkdir -p artifacts

          # 3. Конвертируем со сжатием (-c).
          # Используем 'nix shell nixpkgs#qemu-utils', чтобы точно иметь qemu-img под рукой
          # без необходимости делать apt install.
          # result/*.qcow2 берется как источник, и сразу пишем в artifacts с нужным именем.

          nix shell nixpkgs#qemu-utils -c qemu-img convert \
            -p \
            -O qcow2 \
            -c \
            result/*.qcow2 \
            artifacts/nixos-${{ matrix.arch }}.qcow2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-image-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
