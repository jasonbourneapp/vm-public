name: Build NixOS Images

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # - arch: x86_64
          #   runner: ubuntu-24.04
          #   system: x86_64-linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            system: aarch64-linux

    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load environment variables from .env
        run: |
          # Читаем .env, игнорируем комментарии и пустые строки, добавляем в GITHUB_ENV
          grep -v '^#' .env | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Install SSH Client
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            use-xdg-base-directories = true
            system-features = nixos-test benchmark big-parallel kvm

      - name: Add github.com to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # - name: Pull Binary Cache
      #   if: matrix.arch == 'x86_64'
      #   run: |
      #     nix-store --realise \
      #       --option substituters 'http://devready.work:8080/system https://cache.nixos.org' \
      #       --option trusted-public-keys 'system:R0BqH3u7f2NsG4ySt87TfzMecyeh1daZWDjk/8h1z8g= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=' \
      #       $MUTTER_PATH \
      #       $GNOME_SHELL_PATH \
      #       $JASONBOURNE_PATH

      - name: Pull Binary Cache
        if: matrix.arch == 'arm64'
        run: |
          nix-store --realise \
            --option substituters 'http://devready.work:8080/system https://cache.nixos.org' \
            --option trusted-public-keys 'system:R0BqH3u7f2NsG4ySt87TfzMecyeh1daZWDjk/8h1z8g= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=' \
            $MUTTER_PATH_ARM \
            $GNOME_SHELL_PATH_ARM \
            $JASONBOURNE_PATH_ARM

      - name: Build and Compress QCOW2 Image (with-package)
        run: |
          # 1. Собираем with-package (Light + Proprietary).
          # nix build .#packages.${{ matrix.system }}.with-package -L --impure
          nix build .#packages.${{ matrix.system }}.with-package -L --impure

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-image-${{ matrix.arch }}
          # Указываем путь через result.
          # result — это папка (симлинк), внутри лежит файл .qcow2
          path: result/*.qcow2
          if-no-files-found: error
          retention-days: 1
